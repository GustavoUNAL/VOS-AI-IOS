name: VOSIA
options:
  bundleIdPrefix: com.vosia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  VOSIA:
    type: application
    platform: iOS
    sources:
      - path: VOSIA
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vosia.app.native
        INFOPLIST_FILE: VOSIA/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
      configs:
        # Simulador / Debug: producción (no hace falta API ni Vite locales).
        # Local: VOS_API_BASE_URL=http://127.0.0.1:3000 y VOS_WEB_BASE_URL=http://localhost:5173
        Debug:
          VOS_API_BASE_URL: "https://vos-ia.com/backend"
          VOS_WEB_BASE_URL: "https://vos-ia.com"
        Release:
          VOS_API_BASE_URL: "https://vos-ia.com/backend"
          VOS_WEB_BASE_URL: "https://vos-ia.com"
    info:
      path: VOSIA/Info.plist
      properties:
        CFBundleDisplayName: VOS IA
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        VOS_API_BASE_URL: $(VOS_API_BASE_URL)
        VOS_WEB_BASE_URL: $(VOS_WEB_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.vosia.app.native
            CFBundleURLSchemes:
              - vosia
        NSCalendarsUsageDescription: VOS IA exporta tus eventos personales al Calendario del iPhone cuando lo pedís.
        NSCalendarsFullAccessUsageDescription: VOS IA exporta tus eventos personales al Calendario del iPhone cuando lo pedís.
        NSMicrophoneUsageDescription: Aura usa el micrófono para que puedas hablarle en voz alta.
        NSSpeechRecognitionUsageDescription: Aura convierte tu voz en texto para conversar con vos como un amigo.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  VOSIA:
    build:
      targets:
        VOSIA: all
    run:
      config: Debug
